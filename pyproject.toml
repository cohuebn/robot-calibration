[project]
name = "robot-calibration"
version = "0.1.0"
description = "Various utilities, libraries, etc. used for calibrating robot controllers"
readme = "README.md"
authors = [
    { name = "Cory Huebner", email = "chuebner86@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "colorlog>=6.12.0",
    "nbformat>=5.11.1",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "robotpy-wpiutil>=2026.2.2",
    "scipy>=1.18.1",
]

[project.scripts]
robot-calibration = "robot_calibration:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ruff>=0.16.8",
]
